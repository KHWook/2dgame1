# Builds the web version and puts it on GitHub Pages (README "웹/모바일"). The deploy waits for ./verify to pass.
# Pages has to be switched on once by hand: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "4.7-stable"
  TEMPLATES: "4.7.stable" # the folder name Godot looks for: the version.txt inside the templates

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-web-nothreads

      - name: Download Godot and the web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${TEMPLATES}"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          # only the single-threaded web templates (the preset turns threads off) and the version marker
          unzip -q -j -o /tmp/templates.tpz templates/version.txt templates/web_nothreads_release.zip \
            templates/web_nothreads_debug.zip -d "$HOME/.local/share/godot/export_templates/${TEMPLATES}"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Put Godot on the path
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ~/godot/godot --version

      - name: Import
        run: godot --headless --path . --import

      - name: Verify
        run: ./verify

      - name: Export for the web
        run: |
          mkdir -p build/web
          touch build/.gdignore # Godot does not import what the export writes
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck && test -s build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
